#*************************************************
# ztnvr 主配置
# 全局参数在此设置；相机级参数作为默认值，
# 可被各 <name>-dist.conf 覆盖。
# 语法：key value，'#' 开头为注释
#*************************************************

#*************************************************
# System
#*************************************************
daemon off
log_level 6
log_type ALL
#log_file

device_tmo 10
watchdog_tmo 10

#*************************************************
# Database（sqlite3 时 dbname 为文件路径）
#*************************************************
database_type sqlite3
database_dbname nvr.db
database_busy_timeout 3000

#*************************************************
# Web Control（管理接口；localhost on 仅本机可访问，
# 对外提供服务时改为 off 并务必设置认证）
#*************************************************
webcontrol_port 8081
webcontrol_localhost on
webcontrol_parms 0

#*************************************************
# Web Stream（预览行为）
#*************************************************
stream_preview_scale 30
stream_preview_method static

#*************************************************
# Camera 默认参数（dist 配置可逐台覆盖）
#*************************************************

#--- Camera ---
#device_name
#device_id
#target_dir

#--- Source（v4l2_device 与 netcam_url 二选一）---
#v4l2_device /dev/video0
#netcam_url rtsp://username:password@192.168.1.100:554/stream1

#--- Image ---
#width 640
#height 480
#framerate 15

#--- Overlays ---
text_right %Y-%m-%d\n%T

#--- Method ---
emulate_motion off
threshold 1500

#--- Masks ---
noise_level 32
despeckle_filter EedDl

#--- Detection ---
minimum_motion_frames 1
event_gap 60
pre_capture 3
post_capture 10

#--- Scripts（事件钩子）---
on_event_start
on_event_end

#--- Picture ---
picture_output off
picture_filename %v-%Y%m%d%H%M%S-%q

#--- Movie ---
movie_output on
movie_max_time 120
movie_quality 45
movie_container mkv
movie_filename %v-%Y%m%d%H%M%S

#--- LoopBack（处理后的视频回写 v4l2 设备）---
video_pipe /dev/video1

#*************************************************
# 相机列表——每台相机一个 dist 配置文件
#*************************************************
camera configs/camera1-dist.conf
