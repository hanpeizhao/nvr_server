#*************************************************
# 相机 1 专属配置（覆盖 camera.conf 中的默认值）
#*************************************************

#--- Camera ---
device_name CAM1
device_id 101

#--- Source（v4l2_device 与 netcam_url 二选一）---
#v4l2_device /dev/video0
#netcam_url rtsp://username:password@192.168.1.100:554/stream1

#--- Image ---
width 1280
height 720

#--- Overlays ---
#text_left CAM1

#--- Movie ---
movie_filename CAM1_%t-%v-%Y%m%d%H%M%S
